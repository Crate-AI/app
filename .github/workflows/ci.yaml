name: CI

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:warn

      - name: Run tests
        run: pnpm test

  # Note: Deployment is handled by Cloudflare Git integration
  # This workflow only runs quality checks

