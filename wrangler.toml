name = "app"
main = "entry-worker.js"
assets = { directory = "dist/client" }
compatibility_date = "2024-12-16"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "app-production"
routes = [
  { pattern = "crate.audio/*", zone_name = "crate.audio" }
]

[env.staging]
name = "app-staging"
routes = [
  { pattern = "staging.crate.audio/*", zone_name = "crate.audio" }
]

# Environment variables
[env.production.vars]
ENVIRONMENT = "production"

[env.staging.vars]
ENVIRONMENT = "staging"

# Build configuration
[build]
command = "pnpm build"
cwd = "."
watch_paths = ["src/*/.ts", "src/*/.tsx", "app/*/.ts", "app/*/.tsx"]

# Observability
[observability]
enabled = true